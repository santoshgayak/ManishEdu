<div class="container">
    <div class="hero-section">
        <div class="hero-left">
            <div>
                <h1 class="appearSlow">Discover the Soulful <span> Sounds of the Sarangi</span></h1>
                <p>Comprising a Team of Accomplished Professional Sarangi Players Dedicated to Sharing the Artistry of this Timeless Instrument.</p>
                <div class="hero-btn-container">
                    <button type="button" class="btn mainBtn enrollNowBtn ">Enroll Now</button>
                    <button (click)="openVideo()" class="btn subBtn watchVideosBtn">Watch Videos</button>
                </div>
              
                
            </div>
        </div>
         <div class="hero-right">
            <img src="/images/manish/manish.jpg" alt="manish" >

        </div>

    </div>
  <div id="videoModal" class="video-modal hidden" (click)="outsideClick($event)">
    <div class="video-box" (click)="$event.stopPropagation()">

        <span class="close-btn" (click)="closeVideo()">X</span>

        <iframe 
            src="https://www.facebook.com/plugins/video.php?height=476&href=https%3A%2F%2Fwww.facebook.com%2Freel%2F2479148619206937%2F&show_text=false&width=267&t=0"
            width="100%" 
            height="100%" 
            style="border:none;overflow:hidden"
            scrolling="no"
            frameborder="0"
            allowfullscreen="true"
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture;">
        </iframe>

    </div>
</div>
</div>
