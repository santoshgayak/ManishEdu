<div class="container">
  <div class="cart-payment">
    <form [formGroup]="paymentInfo" (ngSubmit)="savedFormData()" class="customer-info">
      <div class="custinfo">
        <div class="title-info">
          <i class="fa-regular fa-credit-card"></i>
          <h3>Customer Information</h3>
        </div>

        <div class="fullname">
          <div class="fname">
            <label for="firstName">First Name</label>
            <input
              id="firstName"
              type="text"
              formControlName="firstName"
              placeholder="First Name"
              required
            />
          </div>

          <div class="lname">
            <label for="lastName">Last Name</label>
            <input
              id="lastName"
              type="text"
              formControlName="lastName"
              placeholder="Last Name"
              required
            />
          </div>
        </div>

        <div class="contact-info">
          <div class="phone">
            <label for="phone">Phone Number</label>
            <input
              id="phone"
              type="tel"
              formControlName="phone"
              placeholder="XXX-XXX-XXXX"
              required
            />
          </div>

          <div class="email">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="you@email.com"
              required
            />
          </div>
        </div>

        <div formGroupName="address" class="address">
          <div class="addressLine">
            <div class="addresslines">
              <label for="addressLine1">Address Line 1</label>
              <input
                id="addressLine1"
                type="text"
                formControlName="addressLine1"
                placeholder="House Number and Street Name"
                required
              />
            </div>

            <div class="addresslines">
              <label for="addressLine2">Address Line 2</label>
              <input
                id="addressLine2"
                type="text"
                formControlName="addressLine2"
                placeholder="Apt/Unit"
                required
              />
            </div>
          </div>

          <div class="cityAndState">
            <div class="city">
              <label for="city">City</label>
              <input id="city" type="text" formControlName="city" placeholder="City" required />
            </div>

            <div class="state">
              <label for="state">State</label>
              <input id="state" type="text" formControlName="state" placeholder="State" required />
            </div>
          </div>

          <div class="postcodeAndCountry">
            <div class="postcode">
              <label for="postcode">Postcode</label>
              <input
                id="postcode"
                type="text"
                formControlName="postcode"
                placeholder="postcode"
                required
              />
            </div>

            <div class="country">
              <label for="country">Country</label>
              <select id="country" formControlName="country" required>
                <option value="">Select Country</option>
                <option value="DE">Germany</option>
                <option value="IN">India</option>
                <option value="US">United States</option>
              </select>
            </div>
          </div>
        </div>
        <div>
          <button type="submit" class="btn processToPaymentBtn">
            <i class="fa-regular fa-circle-right"></i>
            Proceed to payment
          </button>
        </div>
      </div>
    </form>
  </div>

  <div class="cardtypes-container">
    <div>
      <i class="fa-solid fa-lock"></i>
      <p>256-bit SSL<br /><span>Secure Checkout</span></p>
    </div>

    <div>
      <img src="/images/icons/visa.png" alt="visa logo" height="30px" />
      <img src="/images/icons/card.png" alt="mastercard logo" height="30px" />
      <img src="/images/icons/amex.png" alt="amex logo" height="30px" />
      <img src="/images/icons/discover.png" alt="visa logo" height="30px" />
      <img src="/images/icons/apple-pay.png" alt="apple logo" height="30px" />
      <img src="/images/icons/google-pay.png" alt="google logo" height="30px" />
    </div>

    <div>
      <img src="/images/icons/stripe.png" alt="stripe logo" height="50px" />
      <p>Powered by<br /><span>Stripe</span></p>
    </div>
  </div>
</div>
<app-footer></app-footer>
