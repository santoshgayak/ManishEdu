<div class="dashboard-container">
    <div class="side-nav"  [class.collapsed]="!menuOpen">
        <div class="title-logo">
            <button [class.active]="menuOpen" id="hamburger" type="button" (click)="toggleMenu()"><i class="fa-solid fa-angles-left"></i></button>

        </div>
        <div class="menu-container manage">
            <p class="menu-title">Manage</p>
           <ul class="menus">
                <li>
                    <a routerLink="/dashboard/order" routerLinkActive="active">
                        <i class="fa-brands fa-first-order"></i>
                        <span>Orders</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/dashboard/products" routerLinkActive="active">
                        <i class="fa-solid fa-cubes"></i>
                        <span>Products</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/dashboard/classes" routerLinkActive="active">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <span>Classes</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/dashboard/users" routerLinkActive="active">
                        <i class="fa-solid fa-circle-user"></i>
                        <span>Users</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/dashboard/payments" routerLinkActive="active">
                        <i class="fa-regular fa-credit-card"></i>
                        <span>Payments</span>
                    </a>
                </li>
            </ul>
        </div>
        <span class="divider"></span>
         <div class="menu-container settings">
            <p class="menu-title">Settings</p>
           <ul>
                <li>
                    <a routerLink="/">
                        <i class="fa-solid fa-gear"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li>
                    <a (click)="logOut()">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="menu-container support">
            <span class="needHelp"><i class="fa-solid fa-headset"></i>Need help?</span>
            <span>If you need any help, pleae feel free to contact our support team.</span>
            <a class="suppportBtn" routerLink="/">
                <span>Contact Support</span>
                <i class="fa-solid fa-headset"></i>

            </a>
        </div>
    </div>
    <div class="main-dashboard-container">
        <div class="nav">
            <div class="left">

                 <div class="title-logo">
                    <a routerLink="/dashboard">
                        <img src="logo.png" alt="company logo" class="logo-img" height="70px">
                    </a>
                 </div>
            </div>
            <div class="right">
                <span id="divider"></span>
                
                <div class="user">
                    <span>SG</span>
                    <div class="user-name">
                        <p>Admin</p>
                        <p>admin@manish-edu.com</p>
                    </div>
                    
                      <a (click)="logOut()">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </a>
                </div>
            </div>
        </div>
        <div class="content">
                <router-outlet></router-outlet>
        </div>
    </div>
</div>
