<div class="dashboard-container">
  <div class="side-nav" [class.collapsed]="!menuOpen">
    <div class="title-logo">
      <button [class.active]="menuOpen" id="hamburger" type="button" (click)="toggleMenu()">
        <i class="fa-solid fa-angles-left"></i>
      </button>
    </div>
    <div class="menu-container manage">
      <p class="menu-title">Manage</p>
      <ul class="menus">
        <li>
          <a
            routerLink="/dashboard/main-dashboard"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="fa-solid fa-chart-bar"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a routerLink="/dashboard/order" routerLinkActive="active">
            <i class="fa-brands fa-first-order"></i>
            <span>Orders</span>
          </a>
        </li>
        <li>
          <a routerLink="/dashboard/products" routerLinkActive="active">
            <i class="fa-solid fa-cubes"></i>
            <span>Products</span>
          </a>
        </li>
        <li>
          <a routerLink="/dashboard/classes" routerLinkActive="active">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Classes</span>
          </a>
        </li>
        <li>
          <a routerLink="/dashboard/profile" routerLinkActive="active">
            <i class="fa-solid fa-circle-user"></i>
            <span>Profile</span>
          </a>
        </li>
      </ul>
    </div>
    <span class="divider"></span>
    <div class="menu-container settings">
      <p class="menu-title">Settings</p>
      <ul>
        <li>
          <a routerLink="/">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
          </a>
        </li>
        <li>
          <a (click)="logOut()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>
    </div>
    <div class="menu-container support">
      <a class="suppportBtn" routerLink="/">
        <span>Contact Support</span>
        <i class="fa-solid fa-headset"></i>
      </a>
    </div>
  </div>
  <div class="main-dashboard-container">
    <div class="nav">
      <div class="left">
        <div class="title-logo">
          <a routerLink="/dashboard">
            <img src="logo.png" alt="company logo" class="logo-img" height="70px" />
          </a>
        </div>
      </div>
      <div class="right">
        <span id="divider"></span>

        <div class="user">
          <div class="user-name">
            <p>{{ user.role }}</p>
            <p>{{ user.email }}</p>
          </div>
          <span>{{ user.fName.slice(0, 1) + user.lName.slice(0, 1) }}</span>
          <a (click)="logOut()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </a>
        </div>
      </div>
    </div>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
